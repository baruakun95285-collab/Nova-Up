<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>NovaVault — Video Platform</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #212121;
            --bg-card: rgba(255, 255, 255, 0.06);
            --bg-card-hover: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f1f1f1;
            --text-secondary: #aaaaaa;
            --text-muted: #717171;
            --accent: #ff0000;
            --accent-hover: #cc0000;
            --radius: 12px;
            --transition: 0.2s ease;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        [data-theme="light"] {
            --bg-primary: #f9f9f9;
            --bg-secondary: #ffffff;
            --bg-card: rgba(0, 0, 0, 0.05);
            --bg-card-hover: rgba(0, 0, 0, 0.08);
            --glass-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f0f0f;
            --text-secondary: #606060;
            --text-muted: #909090;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        /* Header mirip YouTube */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
        }
        .brand h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .brand span {
            font-size: 10px;
            color: var(--text-muted);
            position: absolute;
            top: 32px;
            left: 56px;
        }
        .header-center {
            flex: 1;
            max-width: 600px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 16px;
        }
        .search-container {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--bg-primary);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            overflow: hidden;
        }
        .search-container input {
            flex: 1;
            padding: 8px 16px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }
        .search-container input::placeholder {
            color: var(--text-muted);
        }
        .search-container button {
            padding: 8px 20px;
            background: var(--bg-card);
            border: none;
            border-left: 1px solid var(--glass-border);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            transition: background var(--transition);
        }
        .search-container button:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-right button {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .header-right button:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .theme-toggle {
            width: 36px;
            height: 36px;
            padding: 0;
            justify-content: center;
            border-radius: 50% !important;
            font-size: 16px !important;
        }
        /* Konten utama */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px;
        }
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .content-header h2 {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .content-header h2 i {
            color: var(--accent);
        }
        .content-header .right-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .content-header .right-actions button {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .content-header .right-actions button:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .content-header .add-video-btn {
            background: var(--accent) !important;
            border-color: var(--accent) !important;
            color: #fff !important;
            font-weight: 600;
        }
        .content-header .add-video-btn:hover {
            background: var(--accent-hover) !important;
        }
        /* Grid video mirip YouTube */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .video-card {
            background: transparent;
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
        }
        .video-card:hover {
            background: var(--bg-card);
        }
        .video-card .thumb {
            position: relative;
            padding-bottom: 56.25%;
            background: #1a1a1a;
            overflow: hidden;
            border-radius: var(--radius);
        }
        .video-card .thumb img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-card .thumb .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity var(--transition);
            border-radius: var(--radius);
        }
        .video-card:hover .thumb .play-overlay {
            opacity: 1;
        }
        .video-card .thumb .play-overlay i {
            font-size: 40px;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            padding: 16px 16px 16px 22px;
            transition: transform var(--transition);
        }
        .video-card:hover .thumb .play-overlay i {
            transform: scale(1.1);
        }
        .video-card .thumb .duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
        }
        .video-card .btn-delete-video {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            opacity: 0;
            transition: opacity var(--transition);
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-card:hover .btn-delete-video {
            opacity: 1;
        }
        .video-card .btn-delete-video:hover {
            background: rgba(239, 68, 68, 0.8);
        }
        .video-card .info {
            padding: 12px 4px 8px;
            display: flex;
            gap: 12px;
        }
        .video-card .info .channel-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .video-card .info .meta {
            flex: 1;
            min-width: 0;
        }
        .video-card .info .meta h4 {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 4px;
        }
        .video-card .info .meta .sub {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.4;
        }
        .video-card .info .meta .sub span {
            display: inline;
        }
        .video-card .info .meta .sub .dot {
            margin: 0 4px;
        }
        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 64px;
            display: block;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }
        .empty-state p {
            font-size: 14px;
        }
        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--glass-border);
            max-width: 500px;
            width: 100%;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: fadeUp 0.25s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal h3 {
            font-size: 18px;
            margin-bottom: 16px;
        }
        .modal label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .modal input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-primary);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color var(--transition);
            margin-bottom: 12px;
        }
        .modal input:focus {
            border-color: var(--accent);
        }
        .modal .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 8px;
        }
        .modal .modal-actions button {
            padding: 8px 20px;
            border-radius: 20px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all var(--transition);
        }
        .modal .modal-actions .btn-cancel {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--glass-border);
        }
        .modal .modal-actions .btn-cancel:hover {
            background: var(--bg-card-hover);
        }
        .modal .modal-actions .btn-confirm {
            background: var(--accent);
            color: #fff;
        }
        .modal .modal-actions .btn-confirm:hover {
            background: var(--accent-hover);
        }
        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 10px 24px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            font-size: 14px;
            box-shadow: var(--shadow);
            animation: slideUp 0.3s ease;
            pointer-events: auto;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Player Modal */
        .player-modal .modal {
            max-width: 900px;
            padding: 0;
            overflow: hidden;
        }
        .player-modal .player-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
        }
        .player-modal .player-wrapper iframe,
        .player-modal .player-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .player-modal .player-wrapper video {
            object-fit: contain;
            background: #000;
        }
        .player-modal .player-info {
            padding: 16px 20px;
        }
        .player-modal .player-info h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }
        .player-modal .player-info p {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .player-modal .player-actions {
            display: flex;
            gap: 8px;
            padding: 0 20px 16px;
            flex-wrap: wrap;
        }
        .player-modal .player-actions button {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .player-modal .player-actions button:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .player-modal .player-actions .close-player {
            margin-left: auto;
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .player-modal .player-actions .close-player:hover {
            background: var(--accent-hover);
        }
        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 8px 12px;
            }
            .header-center {
                max-width: none;
                margin: 0 8px;
            }
            .header-right button span {
                display: none;
            }
            .main-content {
                padding: 12px;
            }
            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 12px;
            }
        }
        @media (max-width: 480px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
            .header-center {
                display: none;
            }
            .brand span {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Header mirip YouTube -->
    <header class="header">
        <div class="header-left">
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-play"></i></div>
                <h1>NovaVault</h1>
            </div>
        </div>
        <div class="header-center">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Cari video..." />
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
        </div>
        <div class="header-right">
            <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
            <button id="exportBtn"><i class="fas fa-download"></i> <span>Export</span></button>
            <button id="importBtn"><i class="fas fa-upload"></i> <span>Import</span></button>
        </div>
    </header>

    <!-- Konten utama -->
    <main class="main-content">
        <div class="content-header">
            <h2><i class="fas fa-video"></i> Semua Video <span id="videoCount" style="font-size:14px;color:var(--text-muted);font-weight:400;">(0)</span></h2>
            <div class="right-actions">
                <button id="sortBtn"><i class="fas fa-sort"></i> Default</button>
                <button class="add-video-btn" id="addVideoBtn"><i class="fas fa-plus"></i> Tambah Video</button>
            </div>
        </div>
        <div class="video-grid" id="videoGrid"></div>
    </main>

    <!-- Modal umum -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <h3 id="modalTitle">Modal</h3>
            <div id="modalBody"></div>
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancel">Batal</button>
                <button class="btn-confirm" id="modalConfirm">OK</button>
            </div>
        </div>
    </div>

    <!-- Modal pemutar video -->
    <div class="modal-overlay player-modal" id="playerModal">
        <div class="modal">
            <div class="player-wrapper">
                <div id="playerContainer" style="position:absolute;top:0;left:0;width:100%;height:100%;"></div>
            </div>
            <div class="player-info">
                <h3 id="playerTitle">—</h3>
                <p id="playerMeta">—</p>
            </div>
            <div class="player-actions">
                <button id="openBrowserBtn"><i class="fas fa-external-link-alt"></i> Buka di Browser</button>
                <button id="copyLinkBtn"><i class="fas fa-copy"></i> Salin Link</button>
                <button class="close-player" id="closePlayerBtn"><i class="fas fa-times"></i> Tutup</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            'use strict';

            // ===== KONSTANTA =====
            const STORAGE_KEY = 'novavault_videos';
            const THEME_KEY = 'novavault_theme';
            const SORT_KEY = 'novavault_sort';

            // ===== STATE =====
            let videos = [];
            let nextVideoId = 1;
            let currentSort = 'default';
            let searchQuery = '';
            let currentVideoSrc = '';
            let renderScheduled = false;

            // ===== DOM REFS =====
            const videoGrid = document.getElementById('videoGrid');
            const videoCount = document.getElementById('videoCount');
            const searchInput = document.getElementById('searchInput');
            const sortBtn = document.getElementById('sortBtn');
            const themeToggle = document.getElementById('themeToggle');
            const exportBtn = document.getElementById('exportBtn');
            const importBtn = document.getElementById('importBtn');

            const modalOverlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const modalConfirm = document.getElementById('modalConfirm');
            const modalCancel = document.getElementById('modalCancel');

            const playerModal = document.getElementById('playerModal');
            const playerContainer = document.getElementById('playerContainer');
            const playerTitle = document.getElementById('playerTitle');
            const playerMeta = document.getElementById('playerMeta');
            const closePlayerBtn = document.getElementById('closePlayerBtn');
            const openBrowserBtn = document.getElementById('openBrowserBtn');
            const copyLinkBtn = document.getElementById('copyLinkBtn');

            const toastContainer = document.getElementById('toastContainer');

            // ===== THEME =====
            function loadTheme() {
                const saved = localStorage.getItem(THEME_KEY);
                if (saved === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                    themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
                } else {
                    document.documentElement.removeAttribute('data-theme');
                    themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
                }
            }
            function toggleTheme() {
                const current = document.documentElement.getAttribute('data-theme');
                if (current === 'light') {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem(THEME_KEY, 'dark');
                    themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                    localStorage.setItem(THEME_KEY, 'light');
                    themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
                }
            }

            // ===== TOAST =====
            function showToast(msg, duration = 2500) {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = msg;
                toastContainer.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transition = 'opacity 0.3s';
                    setTimeout(() => toast.remove(), 300);
                }, duration);
            }

            // ===== NORMALIZE =====
            function normalizeVideoInput(raw) {
                const iframeSrc = extractIframeSrc(raw);
                if (iframeSrc) raw = iframeSrc;
                raw = raw.trim();
                if (!raw) return null;

                let info = {
                    type: 'iframe',
                    embedUrl: raw,
                    thumbnail: 'https://via.placeholder.com/320x180/1a1a1a/ff0000?text=Video',
                    title: null,
                    originalUrl: raw
                };

                const ytMatch = raw.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&?#]+)/);
                if (ytMatch) {
                    const id = ytMatch[1];
                    info.type = 'youtube';
                    info.embedUrl = `https://www.youtube.com/embed/${id}?autoplay=0&rel=0`;
                    info.thumbnail = `https://img.youtube.com/vi/${id}/maxresdefault.jpg`;
                    info.title = `YouTube Video ${id}`;
                    info.originalUrl = `https://www.youtube.com/watch?v=${id}`;
                    return info;
                }

                const vimeoMatch = raw.match(/vimeo\.com\/(?:video\/)?(\d+)/);
                if (vimeoMatch) {
                    const id = vimeoMatch[1];
                    info.type = 'vimeo';
                    info.embedUrl = `https://player.vimeo.com/video/${id}`;
                    info.thumbnail = 'https://via.placeholder.com/320x180/1a1a1a/ff0000?text=Vimeo';
                    info.title = `Vimeo Video ${id}`;
                    info.originalUrl = `https://vimeo.com/${id}`;
                    return info;
                }

                const dmMatch = raw.match(/dailymotion\.com\/video\/([a-zA-Z0-9]+)/);
                if (dmMatch) {
                    const id = dmMatch[1];
                    info.type = 'dailymotion';
                    info.embedUrl = `https://www.dailymotion.com/embed/video/${id}`;
                    info.thumbnail = 'https://via.placeholder.com/320x180/1a1a1a/ff0000?text=Dailymotion';
                    info.title = `Dailymotion Video ${id}`;
                    info.originalUrl = `https://www.dailymotion.com/video/${id}`;
                    return info;
                }

                if (/\.(mp4|webm|ogg|mov|avi|mkv)(\?.*)?$/i.test(raw)) {
                    info.type = 'video';
                    info.embedUrl = raw;
                    info.thumbnail = 'https://via.placeholder.com/320x180/1a1a1a/ff0000?text=Video+File';
                    info.title = null;
                    info.originalUrl = raw;
                    return info;
                }

                info.type = 'iframe';
                info.embedUrl = raw;
                info.thumbnail = 'https://via.placeholder.com/320x180/1a1a1a/ff0000?text=Video';
                info.title = null;
                info.originalUrl = raw;
                return info;
            }

            function extractIframeSrc(input) {
                const match = input.match(/<iframe[^>]*src=["']([^"']*)["']/i);
                return match ? match[1] : null;
            }

            // ===== LOAD / SAVE =====
            function loadData() {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        if (Array.isArray(parsed)) {
                            videos = parsed;
                            let maxV = 0;
                            videos.forEach(v => { if (v.id > maxV) maxV = v.id; });
                            nextVideoId = maxV + 1;
                            return;
                        }
                    } catch (_) {}
                }
                // Data awal
                videos = [{
                    id: 1,
                    title: 'Cosmic Dreams 4K',
                    views: '12.4 rb',
                    date: '2 hari lalu',
                    quality: '4K HDR',
                    duration: '3:42',
                    src: 'https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=0&rel=0',
                    thumbnail: 'https://img.youtube.com/vi/dQw4w9WgXcQ/maxresdefault.jpg',
                    type: 'youtube',
                    originalUrl: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'
                }];
                nextVideoId = 2;
                saveData();
            }

            function saveData() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(videos));
            }

            // ===== RENDER =====
            function scheduleRender() {
                if (!renderScheduled) {
                    renderScheduled = true;
                    requestAnimationFrame(() => {
                        renderScheduled = false;
                        renderVideos();
                    });
                }
            }

            function getFilteredVideos() {
                let list = [...videos];
                if (searchQuery.trim()) {
                    const q = searchQuery.trim().toLowerCase();
                    list = list.filter(v => v.title.toLowerCase().includes(q));
                }
                if (currentSort === 'title') {
                    list.sort((a, b) => a.title.localeCompare(b.title));
                } else if (currentSort === 'date') {
                    list.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
                } else if (currentSort === 'views') {
                    list.sort((a, b) => {
                        const va = parseInt((a.views || '0').replace(/[^0-9]/g, '')) || 0;
                        const vb = parseInt((b.views || '0').replace(/[^0-9]/g, '')) || 0;
                        return vb - va;
                    });
                }
                return list;
            }

            function renderVideos() {
                const filtered = getFilteredVideos();
                videoGrid.innerHTML = '';
                videoCount.textContent = `(${filtered.length})`;

                if (filtered.length === 0) {
                    videoGrid.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-video"></i>
                            <h3>${searchQuery.trim() ? 'Tidak ada video yang cocok' : 'Belum ada video'}</h3>
                            <p>${searchQuery.trim() ? 'Coba kata kunci lain.' : 'Klik "Tambah Video" untuk menambahkan video pertama.'}</p>
                        </div>
                    `;
                    return;
                }

                const fragment = document.createDocumentFragment();
                filtered.forEach(v => {
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.dataset.id = v.id;
                    const thumb = v.thumbnail || 'https://via.placeholder.com/320x180/1a1a1a/ff0000?text=Video';
                    card.innerHTML = `
                        <div class="thumb">
                            <img src="${thumb}" alt="${v.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/320x180/1a1a1a/ff0000?text=Video'" />
                            <div class="play-overlay"><i class="fas fa-play"></i></div>
                            <span class="duration">${v.duration || '—'}</span>
                            <button class="btn-delete-video" data-id="${v.id}" title="Hapus video"><i class="fas fa-times"></i></button>
                        </div>
                        <div class="info">
                            <div class="channel-avatar">N</div>
                            <div class="meta">
                                <h4>${v.title}</h4>
                                <div class="sub">
                                    <span>NovaVault</span>
                                    <span class="dot">•</span>
                                    <span>${v.views || '—'}</span>
                                    <span class="dot">•</span>
                                    <span>${v.date || '—'}</span>
                                </div>
                            </div>
                        </div>
                    `;
                    fragment.appendChild(card);
                });
                videoGrid.appendChild(fragment);
            }

            // ===== EVENT DELEGATION =====
            videoGrid.addEventListener('click', function(e) {
                const card = e.target.closest('.video-card');
                if (!card) return;
                const id = parseInt(card.dataset.id);
                if (!id) return;

                if (e.target.closest('.btn-delete-video')) {
                    e.stopPropagation();
                    deleteVideo(id);
                    return;
                }
                openPlayer(id);
            });

            // ===== PLAYER =====
            function openPlayer(id) {
                const video = videos.find(v => v.id === id);
                if (!video) return;

                currentVideoSrc = video.originalUrl || video.src || '';
                playerTitle.textContent = video.title || 'Tanpa judul';
                playerMeta.textContent = `${video.views || '—'} • ${video.date || '—'} • ${video.quality || 'Embed'}`;

                playerContainer.innerHTML = '';
                const type = video.type || 'iframe';
                if (type === 'video') {
                    const vid = document.createElement('video');
                    vid.src = video.src;
                    vid.poster = video.thumbnail || '';
                    vid.controls = true;
                    vid.autoplay = true;
                    vid.preload = 'metadata';
                    vid.style.width = '100%';
                    vid.style.height = '100%';
                    vid.style.objectFit = 'contain';
                    vid.style.background = '#000';
                    playerContainer.appendChild(vid);
                } else {
                    const iframe = document.createElement('iframe');
                    iframe.src = video.src || '';
                    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
                    iframe.allowFullscreen = true;
                    iframe.loading = 'lazy';
                    iframe.style.width = '100%';
                    iframe.style.height = '100%';
                    iframe.style.border = '0';
                    iframe.style.display = 'block';
                    playerContainer.appendChild(iframe);
                }
                playerModal.classList.add('show');
            }

            function closePlayer() {
                playerModal.classList.remove('show');
                playerContainer.innerHTML = '';
                currentVideoSrc = '';
            }

            closePlayerBtn.addEventListener('click', closePlayer);
            playerModal.addEventListener('click', (e) => {
                if (e.target === playerModal) closePlayer();
            });

            openBrowserBtn.addEventListener('click', function() {
                if (currentVideoSrc) {
                    window.open(currentVideoSrc, '_blank');
                    showToast('Membuka video di browser...');
                } else {
                    showToast('Tidak ada video yang diputar.');
                }
            });

            copyLinkBtn.addEventListener('click', function() {
                if (currentVideoSrc) {
                    navigator.clipboard.writeText(currentVideoSrc).then(() => {
                        showToast('Link disalin ke clipboard!');
                    }).catch(() => {
                        const textarea = document.createElement('textarea');
                        textarea.value = currentVideoSrc;
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        textarea.remove();
                        showToast('Link disalin!');
                    });
                } else {
                    showToast('Tidak ada link untuk disalin.');
                }
            });

            // ===== CRUD VIDEO =====
            function addVideo(rawInput, customTitle) {
                const info = normalizeVideoInput(rawInput);
                if (!info || !info.embedUrl) {
                    showToast('Link tidak dikenali.');
                    return false;
                }

                if (videos.some(v => v.src === info.embedUrl)) {
                    showToast('Video sudah ada.');
                    return false;
                }

                let title = customTitle || info.title;
                if (!title || title === 'Embed Video' || title === 'Video File' || title === null || title.startsWith('Embed')) {
                    let maxNum = 0;
                    videos.forEach(v => {
                        const match = v.title.match(/^Video\s+(\d+)$/);
                        if (match) {
                            const num = parseInt(match[1]);
                            if (num > maxNum) maxNum = num;
                        }
                    });
                    title = `Video ${maxNum + 1}`;
                }

                const video = {
                    id: nextVideoId++,
                    title: title,
                    views: 'Baru',
                    date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }),
                    quality: info.type === 'youtube' ? 'YouTube 4K' : info.type === 'vimeo' ? 'Vimeo' : info.type === 'dailymotion' ? 'Dailymotion' : 'Embed',
                    duration: '—',
                    src: info.embedUrl,
                    thumbnail: info.thumbnail || 'https://via.placeholder.com/320x180/1a1a1a/ff0000?text=Video',
                    type: info.type,
                    originalUrl: info.originalUrl || info.embedUrl
                };

                videos.push(video);
                saveData();
                renderVideos();
                showToast('Video ditambahkan');
                return true;
            }

            function deleteVideo(id) {
                if (!confirm('Hapus video ini?')) return;
                const idx = videos.findIndex(v => v.id === id);
                if (idx === -1) return;
                videos.splice(idx, 1);
                saveData();
                renderVideos();
                showToast('Video dihapus');
            }

            // ===== EXPORT / IMPORT =====
            function exportData() {
                const data = JSON.stringify(videos, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `novavault_videos_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('Data diekspor');
            }

            function importData(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!Array.isArray(data)) {
                            showToast('Format data tidak valid.');
                            return;
                        }
                        if (!confirm('Data yang ada akan diganti. Lanjutkan?')) return;
                        videos = data;
                        let maxV = 0;
                        videos.forEach(v => { if (v.id > maxV) maxV = v.id; });
                        nextVideoId = maxV + 1;
                        saveData();
                        renderVideos();
                        showToast('Data berhasil diimpor!');
                    } catch (_) {
                        showToast('Gagal membaca file.');
                    }
                };
                reader.readAsText(file);
            }

            // ===== MODAL =====
            let modalCallback = null;
            function openModal(title, bodyHTML, onConfirm) {
                modalTitle.textContent = title;
                modalBody.innerHTML = bodyHTML;
                modalOverlay.classList.add('show');
                modalCallback = onConfirm;
            }
            function closeModal() {
                modalOverlay.classList.remove('show');
                modalCallback = null;
            }
            modalCancel.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });
            modalConfirm.addEventListener('click', function() {
                if (modalCallback) modalCallback();
                closeModal();
            });

            function showAddVideo() {
                openModal(
                    'Tambah Video',
                    `
                        <label for="videoInput">Link video atau kode iframe</label>
                        <input type="text" id="videoInput" placeholder="https://youtu.be/..., https://vimeo.com/..." />
                        <label for="videoTitleInput">Judul (opsional)</label>
                        <input type="text" id="videoTitleInput" placeholder="Judul video" />
                    `,
                    function() {
                        const srcInput = document.getElementById('videoInput');
                        const titleInput = document.getElementById('videoTitleInput');
                        const raw = srcInput.value.trim();
                        if (!raw) { showToast('Masukkan link.'); return; }
                        const title = titleInput.value.trim() || null;
                        addVideo(raw, title);
                    }
                );
                setTimeout(() => {
                    const inp = document.getElementById('videoInput');
                    if (inp) inp.focus();
                }, 100);
            }

            // ===== SORT =====
            function cycleSort() {
                const orders = ['default', 'title', 'date', 'views'];
                const idx = orders.indexOf(currentSort);
                currentSort = orders[(idx + 1) % orders.length];
                localStorage.setItem(SORT_KEY, currentSort);
                const labels = { default: 'Default', title: 'Judul', date: 'Tanggal', views: 'Tayangan' };
                sortBtn.innerHTML = `<i class="fas fa-sort"></i> ${labels[currentSort]}`;
                renderVideos();
            }

            // ===== SEARCH =====
            let searchDebounceTimer = null;
            searchInput.addEventListener('input', function() {
                clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(() => {
                    searchQuery = this.value;
                    renderVideos();
                }, 150);
            });

            // ===== EVENT LISTENERS =====
            sortBtn.addEventListener('click', cycleSort);
            themeToggle.addEventListener('click', toggleTheme);
            exportBtn.addEventListener('click', exportData);
            importBtn.addEventListener('click', function() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = function() {
                    if (this.files.length > 0) importData(this.files[0]);
                    this.remove();
                };
                input.click();
            });

            document.getElementById('addVideoBtn').addEventListener('click', showAddVideo);

            // ===== KEYBOARD SHORTCUTS =====
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.key === 'Escape' && playerModal.classList.contains('show')) {
                    closePlayer();
                }
            });

            // ===== INIT =====
            loadTheme();
            currentSort = localStorage.getItem(SORT_KEY) || 'default';
            const labels = { default: 'Default', title: 'Judul', date: 'Tanggal', views: 'Tayangan' };
            sortBtn.innerHTML = `<i class="fas fa-sort"></i> ${labels[currentSort] || 'Default'}`;

            loadData();
            renderVideos();

            console.log('✅ NovaVault — YouTube style, no playlist');
            showToast('Selamat datang di NovaVault!', 2000);
        })();
    </script>
</body>
</html>
